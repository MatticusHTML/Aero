<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Oriental Flirting Game — Aero</title>
  <style>
    html, body { margin: 0; height: 100%; background: #000; color: #fff; font: 13px Tahoma, sans-serif; }
    #game, ruffle-player { display: block; width: 100%; height: 100%; }
    #status { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; padding: 20px; text-align: center; }
    #status[hidden] { display: none; }
    button { padding: 8px 16px; font: inherit; cursor: pointer; }
  </style>
  <script src="../audio-control.js?v=20261002-penguin" defer></script>
  <script src="../flash-player.js?v=20261002-penguin" defer></script>
  <script src="../ruffle/ruffle.js" defer></script>
</head>
<body>
  <div id="game" aria-label="Game player"></div>
  <div id="status" role="status">
    <span id="status-text">Loading your game…</span>
    <button id="retry" type="button" hidden>Try again</button>
  </div>
</body>
</html>
